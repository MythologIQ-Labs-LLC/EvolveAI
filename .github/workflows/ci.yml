name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (core + CLI)
    runs-on: ubuntu-latest
    steps:
      # NOTE: the Cargo workspace has a path dependency on vendor/GG-CORE/core-runtime,
      # so the submodule is required even though the `ggcore` feature is off by default.
      # If the GG-CORE repository is private, add a deploy key / PAT here via
      # `token:` or `ssh-key:` on this checkout step.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt -p evolve-core -p evolve-cli --check
      - name: Clippy
        run: cargo clippy -p evolve-core -p evolve-cli -- -D warnings
      - name: Tests
        run: cargo test -p evolve-core -p evolve-cli

  tauri:
    name: Tauri shell (compile check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux system dependencies (webkit/GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check evolve-app
        run: cargo check -p evolve-app

  node:
    name: TypeScript (legacy core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
